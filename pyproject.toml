[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lob"
version = "0.1.0"
description = "Limit order book ML: self-collected live L2 data + DeepLOB benchmark"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pyarrow>=16", "websockets>=12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/lob"]
